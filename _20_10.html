<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi bạn 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <!-- ── Name Input Screen ── -->
    <div id="name-screen">
      <div class="name-box">
        <span class="icon">💌</span>
        <p>Nhập tên của bạn nhé</p>
        <input
          id="name-input"
          type="text"
          placeholder="Tên người ấy..."
          maxlength="30"
          autocomplete="off"
        />
        <br />
        <button id="name-submit">Gửi 💖</button>
      </div>
    </div>

    <!-- ── Main Stage (flying letters) ── -->
    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <!-- ── Card ── -->
    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name-el"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <script src="animation.js"></script>
  </body>
</html>
